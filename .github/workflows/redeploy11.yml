name: Redeploy 11

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract redeploy package
        run: |
          unzip -o kyat-deploy11.zip
          rm kyat-deploy11.zip
          rm .github/workflows/redeploy11.yml
      - name: Commit extracted files
        run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Redeploy 11" || echo "nothing to commit"
          git push
