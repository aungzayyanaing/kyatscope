name: Redeploy 4 - extract zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and clean up
        run: |
          unzip -o kyat-deploy4.zip
          rm -f kyat-deploy4.zip
          rm -f .github/workflows/redeploy4.yml
      - name: Commit extracted files
        run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update KyatScope site: index.html, js/ and logos/ (redeploy 4)"
          git push
