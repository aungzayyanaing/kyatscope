name: Unzip KyatScope deploy
on:
  push:
    paths:
      - 'kyat-deploy.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site files to repo root
        run: |
          unzip -o kyat-deploy.zip
          if [ -d kyat-deploy ]; then cp -a kyat-deploy/. .; rm -rf kyat-deploy; fi
          rm -f kyat-deploy.zip
          rm -rf .github
          ls -la
          echo "js files:"; ls js | wc -l
          echo "logos files:"; ls logos | wc -l
      - name: Commit extracted files
        run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing2@gmail.com"
          git add -A
          git commit -m "Add KyatScope site: index.html, js/ and logos/"
          git push
