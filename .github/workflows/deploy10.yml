name: Redeploy 10
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract redeploy package
        run: |
          test -f kyat-deploy10.zip
          unzip -o kyat-deploy10.zip
          rm kyat-deploy10.zip
          rm .github/workflows/deploy10.yml
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Redeploy 10" || echo "nothing to commit"
          git push
